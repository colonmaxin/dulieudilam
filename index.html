<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Studio - Samsung DeX Mode</title>
    <!-- FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e0e0e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- THANH MENU TRÁI (Dành cho DeX rộng rãi) --- */
        .sidebar {
            width: 70px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            border-right: 1px solid #333;
        }

        .sidebar-icon {
            color: #888;
            font-size: 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar-icon:hover, .sidebar-icon.active {
            color: #fe2c55;
        }

        /* --- KHUNG CHÍNH (LAYOUT SAMSUNG DEX) --- */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 350px; /* Cột trái: Điều khiển | Giữa: Màn hình Live chính | Phải: Chat & Tương tác */
            height: 100vh;
        }

        /* Cột 1: Bảng điều khiển Live */
        .control-panel {
            background-color: #121212;
            border-right: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-section h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: white;
            font-size: 14px;
        }

        .input-group textarea {
            resize: none;
            height: 80px;
        }

        .btn-go-live {
            background: #fe2c55;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn-go-live:hover {
            background: #e11d43;
        }

        /* Cột 2: Màn hình Live chính (Chuẩn khung 9:16 nằm giữa) */
        .live-preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #070707;
            position: relative;
            padding: 20px;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 840px;
            background: #000;
            border-radius: 24px;
            border: 4px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Giả lập Camera/Video Stream */
        .camera-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        /* Overlay thông tin trên màn hình Live */
        .live-overlay {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none; /* Để click xuyên qua nếu cần */
        }

        .live-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-tag {
            background: rgba(254, 44, 85, 0.9);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .viewer-count {
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Cột 3: Khung Chat trực tiếp */
        .chat-panel {
            background-color: #121212;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            font-weight: bold;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            font-size: 13px;
            line-height: 1.4;
        }

        .chat-user {
            color: #888;
            font-weight: bold;
            margin-right: 5px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            font-size: 13px;
        }

        .chat-input-area button {
            background: #333;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Thanh Menu Trái -->
    <div class="sidebar">
        <i class="fa-solid fa-house sidebar-icon active" title="Trang chủ"></i>
        <i class="fa-solid fa-video sidebar-icon" title="Quản lý Live"></i>
        <i class="fa-solid fa-chart-line sidebar-icon" title="Thống kê"></i>
        <i class="fa-solid fa-gear sidebar-icon" title="Cài đặt"></i>
    </div>

    <!-- Layout chính chia 3 cột tối ưu cho DeX -->
    <div class="main-container">
        
        <!-- Cột 1: Cài đặt phòng Live -->
        <div class="control-panel">
            <div class="panel-section">
                <h3>Thiết lập phiên Live</h3>
                <div class="input-group">
                    <label>Tiêu đề Live</label>
                    <input type="text" value="Hôm nay live gì ở Samsung DeX đâyyy 🔥">
                </div>
                <div class="input-group">
                    <label>Chủ đề / Mục</label>
                    <input type="text" value="Trò chuyện / Công nghệ">
                </div>
            </div>

            <div class="panel-section">
                <h3>Nguồn Camera / Thiết bị</h3>
                <div class="input-group">
                    <label>Chọn Camera</label>
                    <select id="cameraSelect" style="width:100%; background:#222; border:1px solid #333; border-radius:6px; padding:10px; color:white;">
                        <option>Camera Trước (Front)</option>
                        <option>Camera Sau (Back)</option>
                    </select>
                </div>
            </div>

            <button class="btn-go-live" id="toggleLiveBtn" onclick="toggleLive()">BẮT ĐẦU PHÁT</button>
        </div>

        <!-- Cột 2: Màn hình hiển thị chính (Khung dọc 9:16) -->
        <div class="live-preview-container">
            <div class="phone-frame">
                <!-- Thẻ Video giả lập nguồn camera thực tế -->
                <video class="camera-stream" id="webcam" autoplay playsinline></video>
                
                <div class="live-overlay">
                    <div class="live-header-info">
                        <span class="live-tag"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> LIVE</span>
                        <span class="viewer-count"><i class="fa-solid fa-user"></i> 1,428</span>
                    </div>
                    <!-- Các hiệu ứng tương tác có thể chèn thêm ở đây -->
                </div>
            </div>
        </div>

        <!-- Cột 3: Bảng bình luận (Chat) -->
        <div class="chat-panel">
            <div class="chat-header">Bình luận trực tiếp</div>
            <div class="chat-messages" id="chatBox">
                <div class="chat-message"><span class="chat-user">ThanhNam:</span> Chào ad nhé!</div>
                <div class="chat-message"><span class="chat-user">LanAnh99:</span> Giao diện này nhìn giống PC quá ta</div>
                <div class="chat-message"><span class="chat-user">TechReview:</span> Đang dùng Samsung DeX hả bạn?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Gửi bình luận...">
                <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <script>
        // Kích hoạt Camera của điện thoại (hoặc webcam kết nối qua DeX)
        const videoElement = document.getElementById('webcam');
        
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1080 }, height: { ideal: 1920 } }, 
                    audio: true 
                });
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Không thể mở camera: ", error);
                alert("Vui lòng cấp quyền sử dụng Camera để chạy giao diện Live.");
            }
        }

        initCamera();

        // Xử lý nút Bắt đầu/Kết thúc Live
        let isLive = false;
        function toggleLive() {
            const btn = document.getElementById('toggleLiveBtn');
            isLive = !isLive;
            if(isLive) {
                btn.style.background = "#333";
                btn.innerText = "KẾT THÚC";
            } else {
                btn.style.background = "#fe2c55";
                btn.innerText = "BẮT ĐẦU PHÁT";
            }
        }

        // Giả lập gửi tin nhắn chat nhanh
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chatBox');
            if(input.value.trim() !== "") {
                const msg = document.createElement('div');
                msg.className = 'chat-message';
                msg.innerHTML = `<span class="chat-user" style="color:#fe2c55;">Bạn:</span> ${input.value}`;
                chatBox.appendChild(msg);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
