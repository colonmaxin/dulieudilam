<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle OBS - HTML</title>
    <!-- Importando a biblioteca oficial do OBS WebSocket para JS -->
    <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5/dist/obs-websocket.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 50px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .red { background: #dc3545; }
        .red:hover { background: #a71d2a; }
        #status { font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel OBS Full HTML</h2>
        <div id="status" style="color: orange;">Status: Desconectado</div>
        
        <hr style="border: 0; border-top: 1px solid #444;">

        <h3>Gravação / Transmissão</h3>
        <button onclick="startRecord()">Iniciar Gravação</button>
        <button class="red" onclick="stopRecord()">Parar Gravação</button>
        <br>
        <button onclick="startStream()">Iniciar Live</button>
        <button class="red" onclick="stopStream()">Parar Live</button>

        <hr style="border: 0; border-top: 1px solid #444;">

        <h3>Cenas</h3>
        <!-- Substitua 'Cena 2' pelo nome exato da sua cena no OBS -->
        <button onclick="changeScene('Cena 2') Mudar para Cena 2</button>
    </div>

    <script>
        const obs = new OBSWebSocket();

        async function connectOBS() {
            try {
                // Altere a porta (4455) e a senha caso tenha configurado no OBS
                // Se não colocou senha, remova o campo 'password'
                await obs.connect('ws://192.168.1.10:4455', 'SUA_SENHA_AQUI');
                
                document.getElementById('status').innerText = "Status: Conectado com Sucesso!";
                document.getElementById('status').style.color = "lightgreen";
                console.log('Conectado ao OBS Studio!');
            } catch (error) {
                document.getElementById('status').innerText = "Status: Falha na Conexão";
                document.getElementById('status').style.color = "red";
                console.error('Erro ao conectar ao OBS:', error);
            }
        }

        // Funções de Controle
        async function startRecord() {
            try { await obs.call('StartRecord'); } catch (e) { console.error(e); }
        }

        async function stopRecord() {
            try { await obs.call('StopRecord'); } catch (e) { console.error(e); }
        }

        async function startStream() {
            try { await obs.call('StartStream'); } catch (e) { console.error(e); }
        }

        async function stopStream() {
            try { await obs.call('StopStream'); } catch (e) { console.error(e); }
        }

        async function changeScene(sceneName) {
            try {
                await obs.call('SetCurrentProgramScene', { sceneName: sceneName });
            } catch (e) {
                console.error('Erro ao mudar de cena:', e);
            }
        }

        // Executa a conexão ao carregar a página
        connectOBS();
    </script>
</body>
</html>
