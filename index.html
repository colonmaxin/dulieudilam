<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình duyệt nhúng tích hợp xem số dư</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Thanh hiển thị số dư */
        .balance-bar {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .balance-value {
            font-size: 18px;
            background: #2196F3;
            padding: 5px 12px;
            border-radius: 4px;
        }
        /* Thanh công cụ điều hướng */
        .browser-toolbar {
            background-color: #34495e;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .browser-toolbar button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .browser-toolbar button:hover {
            background-color: #27ae60;
        }
        .browser-toolbar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        /* Khung chứa trang web */
        .browser-content {
            flex: 1;
            background-color: white;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Thanh thông tin số dư -->
    <div class="balance-bar">
        <span>💰 Số dư tài khoản nhận được:</span>
        <span id="externalBalance" class="balance-value">Đang cập nhật...</span>
    </div>

    <!-- Thanh công cụ trình duyệt -->
    <div class="browser-toolbar">
        <button onclick="reloadPage()">🔄</button>
        <input type="text" id="urlInput" placeholder="Nhập URL hoặc dùng trang mẫu...">
        <button onclick="loadWebPage()">Đi</button>
    </div>

    <!-- Khung iframe -->
    <div class="browser-content">
        <iframe id="webFrame"></iframe>
    </div>

    <script>
        const webFrame = document.getElementById('webFrame');
        const urlInput = document.getElementById('urlInput');
        const balanceDisplay = document.getElementById('externalBalance');

        // Tạo một trang web mẫu bằng Data URL để bạn có thể test trực tiếp ngay trên 1 file HTML mà không cần server ngoài
        const sampleWebPageContent = `
            <!DOCTYPE html>
            <html lang="vi">
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Arial; padding: 20px; background: #f9f9f9; text-align: center; }
                    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
                    button { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
                </style>
            </head>
            <body>
                <div class="card">
                    <h2>Trang Web Đích (Mẫu)</h2>
                    <p>Số dư hiện tại của bạn: <strong id="myBalance" style="color: green; font-size: 20px;">1,500,000 VNĐ</strong></p>
                    <button onclick="changeBalance()">Thay đổi số dư ngẫu nhiên</button>
                </div>
                <script>
                    function sendBalance() {
                        const balanceText = document.getElementById('myBalance').innerText;
                        window.parent.postMessage({ type: 'UPDATE_BALANCE', balance: balanceText }, '*');
                    }
                    function changeBalance() {
                        const randomNum = Math.floor(Math.random() * 9000000 + 1000000);
                        document.getElementById('myBalance').innerText = randomNum.toLocaleString() + ' VNĐ';
                        sendBalance();
                    }
                    // Gửi số dư ngay khi load xong
                    window.onload = sendBalance;
                <\/script>
            </body>
            </html>
        `;

        // Chuyển nội dung mẫu thành dạng Data URL để nhúng thẳng vào iframe
        const sampleUrl = 'data:text/html;charset=utf-8,' + encodeURIComponent(sampleWebPageContent);
        
        // Gán giá trị mặc định khi mở file
        urlInput.value = "Trang web mẫu nội bộ";
        webFrame.src = sampleUrl;

        // Hàm tải trang
        function loadWebPage() {
            let url = urlInput.value.trim();
            if (url === "Trang web mẫu nội bộ" || url === "") {
                webFrame.src = sampleUrl;
            } else {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                    urlInput.value = url;
                }
                webFrame.src = url;
            }
        }

        // Tải lại trang
        function reloadPage() {
            webFrame.src = webFrame.src;
        }

        // Lắng nghe dữ liệu (số dư) gửi từ iframe ra ngoài
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'UPDATE_BALANCE') {
                balanceDisplay.innerText = event.data.balance;
            }
        });
    </script>

</body>
</html>
