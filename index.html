<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DeX Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; }

        /* Màn hình nền Desktop */
        #dex-desktop {
            width: 100vw;
            height: calc(100vh - 48px);
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            position: relative;
            padding: 20px;
        }

        /* Icon ngoài Desktop */
        .desktop-icon {
            width: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .desktop-icon:hover { background: rgba(255,255,255,0.1); }
        .desktop-icon div:first-child { font-size: 32px; margin-bottom: 5px; }
        .desktop-icon span { font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* Taskbar phong cách DeX ở dưới cùng */
        #dex-taskbar {
            width: 100vw;
            height: 48px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            bottom: 0;
            left: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
            padding: 0 10px;
        }

        .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 5px; }

        .taskbar-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .taskbar-btn:hover { background: rgba(255,255,255,0.15); }

        /* Cửa sổ ứng dụng (Window) */
        .dex-window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 600px;
            height: 400px;
            background: #242424;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .window-header {
            height: 36px;
            background: #2e2e2e;
            color: #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 13px;
            cursor: move;
        }

        .window-controls button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
        }
        .window-controls button:hover { background: rgba(255,255,255,0.2); color: white; }
        .window-controls button.close-btn:hover { background: #e81123; color: white; }

        .window-body {
            flex: 1;
            background: #ffffff;
            color: #333;
            padding: 15px;
            overflow-y: auto;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Màn hình chính -->
    <div id="dex-desktop">
        <!-- Icon mẫu mở trình duyệt -->
        <div class="desktop-icon" onclick="openWindow('browserWindow')">
            <div>🌐</div>
            <span>Trình duyệt</span>
        </div>
    </div>

    <!-- Cửa sổ ứng dụng mẫu -->
    <div id="browserWindow" class="dex-window hidden">
        <div class="window-header" onmousedown="dragWindow(event, 'browserWindow')">
            <span>Trình duyệt Samsung DeX</span>
            <div class="window-controls">
                <button onclick="minimizeWindow('browserWindow')">🗕</button>
                <button onclick="closeWindow('browserWindow')">✕</button>
            </div>
        </div>
        <div class="window-body">
            <h3>Chào mừng bạn đến với mô phỏng Samsung DeX trên Web!</h3>
            <p>Ứng dụng này đang chạy trong một cửa sổ có thể tùy biến.</p>
        </div>
    </div>

    <!-- Thanh Taskbar -->
    <div id="dex-taskbar">
        <div class="taskbar-left">
            <button class="taskbar-btn" onclick="toggleStartMenu()">
                <span>🪟</span> <b>DeX</b>
            </button>
            <button class="taskbar-btn" onclick="openWindow('browserWindow')">🌐 Trình duyệt</button>
        </div>
        <div class="taskbar-right">
            <span id="clock" style="color: white; font-size: 13px; padding: 0 10px;">00:00</span>
        </div>
    </div>

    <script>
        // Đồng hồ góc phải
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Mở cửa sổ
        function openWindow(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        // Đóng cửa sổ
        function closeWindow(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // Thu nhỏ cửa sổ
        function minimizeWindow(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // Tính năng kéo thả cửa sổ (Drag Window) đơn giản
        function dragWindow(e, id) {
            const win = document.getElementById(id);
            let shiftX = e.clientX - win.getBoundingClientRect().left;
            let shiftY = e.clientY - win.getBoundingClientRect().top;

            function moveAt(pageX, pageY) {
                win.style.left = pageX - shiftX + 'px';
                win.style.top = pageY - shiftY + 'px';
            }

            function onMouseMove(e) {
                moveAt(e.pageX, e.pageY);
            }

            document.addEventListener('mousemove', onMouseMove);

            win.onmouseup = function() {
                document.removeEventListener('mousemove', onMouseMove);
                win.onmouseup = null;
            };
        }
    </script>
</body>
</html>
