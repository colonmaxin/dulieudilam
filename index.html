<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập LINE - HTML thuần</title>
    <!-- Thư viện SDK LINE Login -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            min-width: 300px;
        }
        .line-btn {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .line-btn:hover {
            background-color: #05b34c;
        }
        .logout-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .logout-btn:hover {
            background-color: #e03e3e;
        }
        img.avatar {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Đăng nhập hệ thống</h2>
        <br>

        <!-- Phần nút đăng nhập (hiện khi chưa đăng nhập) -->
        <div id="login-section">
            <button class="line-btn" onclick="lineLogin()">
                <span>Đăng nhập với LINE</span>
            </button>
        </div>

        <!-- Phần hiển thị thông tin profile (hiện sau khi đăng nhập thành công) -->
        <div id="profile-section" class="hidden">
            <img id="profile-picture" class="avatar" src="" alt="Avatar">
            <h3 id="profile-name"></h3>
            <p><strong>LINE User ID:</strong> <span id="profile-id"></span></p>
            <p><strong>Email:</strong> <span id="profile-email">Không có</span></p>
            <button class="logout-btn" onclick="lineLogout()">Đăng xuất</button>
        </div>
    </div>

    <script>
        // THAY THẾ CHANNEL ID CỦA BẠN VÀO ĐÂY
        const CHANNEL_ID = "YOUR_LINE_CHANNEL_ID";

        // Khởi tạo LIFF (LINE Front-end Framework)
        window.onload = async function () {
            try {
                await liff.init({ liffId: CHANNEL_ID });

                // Kiểm tra xem người dùng đã đăng nhập LINE trước đó chưa
                if (liff.isLoggedIn()) {
                    runAfterLogin();
                }
            } catch (error) {
                console.error('Lỗi khởi tạo LIFF:', error);
                alert('Khởi tạo ứng dụng thất bại. Hãy kiểm tra lại Channel ID (LIFF ID).');
            }
        };

        // Hàm gọi khi bấm nút Đăng nhập
        function lineLogin() {
            if (!liff.isLoggedIn()) {
                // Chuyển hướng người dùng sang trang đăng nhập của LINE
                liff.login();
            }
        }

        // Hàm lấy và hiển thị thông tin sau khi đăng nhập thành công
        async function runAfterLogin() {
            try {
                const profile = await liff.getProfile();
                
                // Hiển thị dữ liệu lên giao diện
                document.getElementById('profile-picture').src = profile.pictureUrl;
                document.getElementById('profile-name').textContent = profile.displayName;
                document.getElementById('profile-id').textContent = profile.userId;

                // Nếu có quyền đọc email (cần cấu hình scope trong LINE Developers Console)
                try {
                    const email = liff.getDecodedIDToken().email;
                    if (email) {
                        document.getElementById('profile-email').textContent = email;
                    }
                } catch (e) {
                    console.log('Không lấy được email hoặc chưa cấp quyền.');
                }

                // Ẩn nút đăng nhập, hiện thông tin profile
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('profile-section').classList.remove('hidden');

            } catch (error) {
                console.error('Lỗi lấy thông tin profile:', error);
            }
        }

        // Hàm Đăng xuất
        function lineLogout() {
            if (liff.isLoggedIn()) {
                liff.logout();
                // Reload lại trang sau khi đăng xuất
                window.location.reload();
            }
        }
    </script>

</body>
</html>
