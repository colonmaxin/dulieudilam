<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DeX - Multi Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; }

        /* Màn hình nền Desktop */
        #dex-desktop {
            width: 100vw;
            height: calc(100vh - 48px);
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            position: relative;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        /* Icon ngoài Desktop */
        .desktop-icon {
            width: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
            height: fit-content;
        }
        .desktop-icon:hover { background: rgba(255,255,255,0.1); }
        .desktop-icon div:first-child { font-size: 32px; margin-bottom: 5px; }
        .desktop-icon span { font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* Taskbar phong cách DeX */
        #dex-taskbar {
            width: 100vw;
            height: 48px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            bottom: 0;
            left: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 10000;
            padding: 0 10px;
        }

        .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 5px; }

        .taskbar-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .taskbar-btn:hover { background: rgba(255,255,255,0.15); }

        /* Cửa sổ ứng dụng (Window) động */
        .dex-window {
            position: absolute;
            background: #242424;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            resize: both; /* Cho phép kéo giãn cửa sổ (tuỳ chọn) */
        }

        .window-header {
            height: 36px;
            background: #2e2e2e;
            color: #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 13px;
            cursor: move;
            user-select: none;
        }

        .window-controls button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
        }
        .window-controls button:hover { background: rgba(255,255,255,0.2); color: white; }
        .window-controls button.close-btn:hover { background: #e81123; color: white; }

        /* Nội dung bên trong trình duyệt */
        .browser-toolbar {
            background: #333;
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        .browser-toolbar input {
            flex: 1;
            padding: 5px 10px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .browser-toolbar input:focus { border-color: #007acc; }

        .browser-toolbar button {
            background: #444;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .browser-toolbar button:hover { background: #555; }

        .window-body {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .window-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Màn hình chính -->
    <div id="dex-desktop">
        <!-- Icon mở trình duyệt ngoài Desktop -->
        <div class="desktop-icon" onclick="openBrowserWindow()">
            <div>🌐</div>
            <span>Google Chrome</span>
        </div>
    </div>

    <!-- Thanh Taskbar -->
    <div id="dex-taskbar">
        <div class="taskbar-left">
            <button class="taskbar-btn"><span>🪟</span> <b>DeX</b></button>
            <button class="taskbar-btn" onclick="openBrowserWindow()">🌐 Mở thêm Google</button>
        </div>
        <div class="taskbar-right">
            <span id="clock" style="color: white; font-size: 13px; padding: 0 10px;">00:00</span>
        </div>
    </div>

    <script>
        // Đồng hồ góc phải
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        let windowCounter = 0;
        const desktop = document.getElementById('dex-desktop');

        // Hàm mở một cửa sổ trình duyệt mới
        function openBrowserWindow(initialUrl = "https://www.google.com/search?igu=1") {
            windowCounter++;
            const winId = `browser-win-${windowCounter}`;

            // Tạo phần tử HTML cho cửa sổ
            const winDiv = document.createElement('div');
            winDiv.className = 'dex-window';
            winDiv.id = winId;
            
            // Đặt vị trí xuất hiện lệch nhau một chút để không bị che khuất hoàn toàn
            let offset = (windowCounter % 5) * 30;
            winDiv.style.top = `${60 + offset}px`;
            winDiv.style.left = `${120 + offset}px`;
            winDiv.style.width = '700px';
            winDiv.style.height = '450px';
            winDiv.style.zIndex = 100 + windowCounter;

            winDiv.innerHTML = `
                <div class="window-header" onmousedown="bringToFront('${winId}')">
                    <span>Google Chrome #${windowCounter}</span>
                    <div class="window-controls">
                        <button onclick="minimizeWindow('${winId}')">🗕</button>
                        <button class="close-btn" onclick="closeWindow('${winId}')">✕</button>
                    </div>
                </div>
                <div class="browser-toolbar">
                    <button onclick="goBack('${winId}')">⬅</button>
                    <button onclick="goForward('${winId}')">➡</button>
                    <button onclick="reloadPage('${winId}')">🔄</button>
                    <input type="text" class="url-input" value="${initialUrl}" onkeydown="handleUrlInput(event, '${winId}')">
                    <button onclick="navigateUrl('${winId}')">Đi</button>
                </div>
                <div class="window-body">
                    <iframe id="iframe-${winId}" src="${initialUrl}"></iframe>
                </div>
            `;

            desktop.appendChild(winDiv);
            makeDraggable(winDiv);
        }

        // Đóng cửa sổ
        function closeWindow(id) {
            const win = document.getElementById(id);
            if (win) win.remove();
        }

        // Thu nhỏ cửa sổ (ẩn đi)
        function minimizeWindow(id) {
            const win = document.getElementById(id);
            if (win) win.style.display = 'none';
        }

        // Đưa cửa sổ lên trên cùng khi bấm vào
        function bringToFront(id) {
            const win = document.getElementById(id);
            if (win) {
                // Tăng z-index cao hơn tất cả các cửa sổ khác
                const allWindows = document.querySelectorAll('.dex-window');
                let maxZ = 100;
                allWindows.forEach(w => {
                    let z = parseInt(window.getComputedStyle(w).zIndex);
                    if (z > maxZ) maxZ = z;
                });
                win.style.zIndex = maxZ + 1;
            }
        }

        // Điều hướng URL khi bấm nút "Đi" hoặc nhấn Enter
        function navigateUrl(id) {
            const win = document.getElementById(id);
            const input = win.querySelector('.url-input');
            const iframe = win.querySelector('iframe');
            let url = input.value.trim();
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(url);
                input.value = url;
            }
            iframe.src = url;
        }

        function handleUrlInput(e, id) {
            if (e.key === 'Enter') {
                navigateUrl(id);
            }
        }

        function reloadPage(id) {
            const iframe = document.querySelector(`#iframe-${id}`);
            iframe.contentWindow.location.reload();
        }

        // Kéo thả cửa sổ (Drag & Drop) mượt mà
        function makeDraggable(elmnt) {
            const header = elmnt.querySelector('.window-header');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                bringToFront(elmnt.id);
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onelementDrag = elementDrag;
                document.addEventListener('mousemove', elementDrag);
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.removeEventListener('mousemove', elementDrag);
            }
        }

        // Mở sẵn 1 cửa sổ khi vừa vào trang
        window.onload = function() {
            openBrowserWindow();
        };
    </script>
</body>
</html>
