<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giả lập đăng nhập LINE - PC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .line-login-container {
            background: #ffffff;
            width: 420px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .line-logo {
            font-size: 32px;
            font-weight: bold;
            color: #06C755;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .line-logo span {
            color: #222;
        }

        h2 {
            font-size: 20px;
            color: #222;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        /* Tabs chuyển đổi qua lại */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #888;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #06C755;
            border-bottom-color: #06C755;
        }

        /* Nội dung từng tab */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Tab QR Code */
        .qr-box {
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-placeholder {
            width: 160px;
            height: 160px;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            border-radius: 4px;
            margin: 0 auto;
            position: relative;
        }
        
        .qr-placeholder::after {
            content: "QR Code LINE";
            font-weight: bold;
        }

        .qr-instruction {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        /* Tab Email/Password */
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus {
            border-color: #06C755;
        }

        .login-btn {
            width: 100%;
            background-color: #06C755;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: #05b34c;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="line-login-container">
        <div class="line-logo">LINE <span>PC</span></div>
        
        <h2>Đăng nhập LINE</h2>
        <p class="subtitle">Trò chuyện mọi lúc, mọi nơi trên máy tính của bạn</p>

        <!-- Thanh chuyển đổi tab -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('qr')">Mã QR</div>
            <div class="tab" onclick="switchTab('email')">Email / Mật khẩu</div>
        </div>

        <!-- Nội dung Tab 1: Mã QR -->
        <div id="tab-qr" class="tab-content active">
            <div class="qr-box">
                <div class="qr-placeholder"></div>
            </div>
            <p class="qr-instruction">
                Mở ứng dụng LINE trên điện thoại của bạn, chọn biểu tượng quét mã QR để đăng nhập.
            </p>
        </div>

        <!-- Nội dung Tab 2: Email & Mật khẩu (Giả lập) -->
        <div id="tab-email" class="tab-content">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email tài khoản LINE</label>
                    <input type="email" id="email" placeholder="Nhập email của bạn" required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="login-btn">Đăng nhập</button>
            </form>
        </div>

        <div class="footer-note">
            Trang web giả lập giao diện LINE PC (Chỉ để trưng bày / học tập)
        </div>
    </div>

    <script>
        // Hàm chuyển đổi qua lại giữa tab QR và tab Nhập thông tin
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));

            if (type === 'qr') {
                tabs[0].classList.add('active');
                document.getElementById('tab-qr').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('tab-email').classList.add('active');
            }
        }

        // Hàm giả lập sự kiện khi bấm nút đăng nhập ở tab email
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            alert(`[Giả lập] Đã nhận thông tin đăng nhập của: ${email}\n(Đây chỉ là trang web giao diện tĩnh, không kết nối hệ thống thật của LINE).`);
        }
    </script>

</body>
</html>
