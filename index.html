<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Studio - Web Simulator</title>
    <!-- FontAwesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --obs-bg: #1e1e1e;
            --obs-panel: #2d2d2d;
            --obs-border: #444;
            --obs-accent: #007acc;
            --obs-text: #cccccc;
            --obs-live: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--obs-bg);
            color: var(--obs-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- TOP MENU BAR --- */
        .top-menu {
            height: 30px;
            background-color: #252526;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            border-bottom: 1px solid var(--obs-border);
        }
        .top-menu span {
            padding: 0 10px;
            cursor: pointer;
        }
        .top-menu span:hover {
            background-color: #3e3e42;
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        /* Preview Area */
        .preview-container {
            flex-grow: 1;
            background-color: #000;
            border: 1px solid var(--obs-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Lật gương cho tự nhiên */
        }

        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--obs-live);
            color: white;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
            display: none;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .stream-timer {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 3px;
            display: none;
        }

        /* --- BOTTOM PANELS --- */
        .bottom-panels {
            height: 220px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }

        .panel {
            background-color: var(--obs-panel);
            border: 1px solid var(--obs-border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background-color: #333;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--obs-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            flex-grow: 1;
            padding: 8px;
            overflow-y: auto;
            font-size: 13px;
        }

        /* List Items (Scenes & Sources) */
        .obs-list-item {
            padding: 6px 8px;
            margin-bottom: 3px;
            background-color: #383838;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .obs-list-item.active {
            background-color: var(--obs-accent);
            color: white;
        }

        /* Audio Mixer Meters */
        .audio-channel {
            margin-bottom: 10px;
        }
        .audio-label {
            font-size: 11px;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }
        .audio-bar-container {
            height: 8px;
            background-color: #222;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .audio-bar {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
            transition: width 0.1s ease;
        }

        /* Controls Panel */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            align-content: start;
        }

        .obs-btn {
            background-color: #383838;
            color: var(--obs-text);
            border: 1px solid var(--obs-border);
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            transition: 0.2s;
        }

        .obs-btn:hover {
            background-color: #505050;
        }

        .obs-btn.primary {
            background-color: #2e7d32;
            color: white;
            border-color: #388e3c;
        }
        .obs-btn.primary.is-live {
            background-color: #c62828;
            border-color: #d32f2f;
        }

        .obs-btn.secondary {
            background-color: #1565c0;
            color: white;
        }
    </style>
</head>
<body>

    <!-- TOP MENU -->
    <div class="top-menu">
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Profile</span>
        <span>Scene Collection</span>
        <span>Tools</span>
        <span>Help</span>
    </div>

    <!-- MAIN WORKSPACE -->
    <div class="workspace">
        <!-- PREVIEW SCREEN -->
        <div class="preview-container">
            <div class="live-badge" id="liveBadge"><i class="fa-solid fa-circle"></i> LIVE</div>
            <div class="stream-timer" id="streamTimer">00:00:00</div>
            <!-- Video hiển thị webcam trực tiếp -->
            <video id="webcamVideo" autoplay playsinline muted></video>
        </div>

        <!-- BOTTOM PANELS -->
        <div class="bottom-panels">
            <!-- 1. Scenes -->
            <div class="panel">
                <div class="panel-header">
                    <span>Scenes</span>
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="panel-body">
                    <div class="obs-list-item active">Cảnh chính (Webcam)</div>
                    <div class="obs-list-item">Màn hình chia sẻ (Screen)</div>
                    <div class="obs-list-item">Đang tạm nghỉ (BRB)</div>
                </div>
            </div>

            <!-- 2. Sources -->
            <div class="panel">
                <div class="panel-header">
                    <span>Sources</span>
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="panel-body">
                    <div class="obs-list-item active"><i class="fa-solid fa-video"></i> Video Capture Device</div>
                    <div class="obs-list-item"><i class="fa-solid fa-volume-high"></i> Audio Output Capture</div>
                    <div class="obs-list-item"><i class="fa-solid fa-image"></i> Logo / Overlay</div>
                </div>
            </div>

            <!-- 3. Audio Mixer -->
            <div class="panel">
                <div class="panel-header">
                    <span>Audio Mixer</span>
                </div>
                <div class="panel-body">
                    <div class="audio-channel">
                        <div class="audio-label"><span>Mic/Aux</span> <span id="micVol">35dB</span></div>
                        <div class="audio-bar-container">
                            <div class="audio-bar" id="micBar" style="width: 45%;"></div>
                        </div>
                    </div>
                    <div class="audio-channel">
                        <div class="audio-label"><span>Desktop Audio</span> <span>12dB</span></div>
                        <div class="audio-bar-container">
                            <div class="audio-bar" style="width: 20%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. Controls -->
            <div class="panel">
                <div class="panel-header">
                    <span>Controls</span>
                </div>
                <div class="panel-body controls-grid">
                    <button class="obs-btn primary" id="streamBtn" onclick="toggleStream()">Start Streaming</button>
                    <button class="obs-btn secondary" id="recBtn" onclick="toggleRecord()">Start Recording</button>
                    <button class="obs-btn">Studio Mode</button>
                    <button class="obs-btn" onclick="alert('Mở bảng cài đặt OBS chuẩn')">Settings</button>
                    <button class="obs-btn" style="grid-column: span 2;" onclick="alert('Đã thoát khỏi ứng dụng OBS.')">Exit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ -->
    <script>
        // 1. Khởi động Webcam thực tế đưa vào màn hình Preview
        const videoElement = document.getElementById('webcamVideo');
        
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                videoElement.srcObject = stream;
            })
            .catch(err => {
                console.warn("Không tìm thấy Webcam hoặc bị từ chối quyền truy cập:", err);
                // Tạo màn hình nền giả lập nếu không có webcam
                videoElement.style.display = 'none';
                let alertBox = document.createElement('div');
                alertBox.style.color = '#fff';
                alertBox.style.textAlign = 'center';
                alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="font-size:30px; margin-bottom:10px;"></i><br>Không tìm thấy Webcam.<br>Hiển thị khung hình trống.';
                document.querySelector('.preview-container').appendChild(alertBox);
            });

        // 2. Hiệu ứng thanh âm thanh nhảy múa tự nhiên (Audio Mixer)
        setInterval(() => {
            let randomWidth = Math.floor(Math.random() * 60) + 15; // dao động từ 15% đến 75%
            let bar = document.getElementById('micBar');
            if(bar) bar.style.width = randomWidth + '%';
        }, 120);

        // 3. Xử lý logic nút Start/Stop Streaming
        let isStreaming = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        function toggleStream() {
            const btn = document.getElementById('streamBtn');
            const liveBadge = document.getElementById('liveBadge');
            const streamTimer = document.getElementById('streamTimer');

            isStreaming = !isStreaming;

            if (isStreaming) {
                btn.innerText = "Stop Streaming";
                btn.classList.add("is-live");
                liveBadge.style.display = "flex";
                streamTimer.style.display = "block";
                
                // Bắt đầu đếm giờ
                secondsElapsed = 0;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    let hrs = Math.floor(secondsElapsed / 3600).toString().padStart(2, '0');
                    let mins = Math.floor((secondsElapsed % 3600) / 60).toString().padStart(2, '0');
                    let secs = (secondsElapsed % 60).toString().padStart(2, '0');
                    streamTimer.innerText = `${hrs}:${mins}:${secs}`;
                }, 1000);

            } else {
                btn.innerText = "Start Streaming";
                btn.classList.remove("is-live");
                liveBadge.style.display = "none";
                streamTimer.style.display = "none";
                
                // Dừng đếm giờ
                clearInterval(timerInterval);
            }
        }

        // 4. Xử lý nút Ghi hình (Recording)
        let isRecording = false;
        function toggleRecord() {
            const recBtn = document.getElementById('recBtn');
            isRecording = !isRecording;
            if(isRecording) {
                recBtn.innerText = "Stop Recording";
                recBtn.style.backgroundColor = "#8e44ad";
            } else {
                recBtn.innerText = "Start Recording";
                recBtn.style.backgroundColor = "";
            }
        }
    </script>
</body>
</html>
