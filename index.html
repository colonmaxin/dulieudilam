<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Browser Mobile Fit</title>
    
    <!-- Nhúng Gridstack CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/gridstack.js/10.1.2/gridstack.min.css" rel="stylesheet"/>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Khóa màn hình điện thoại không cho cuộn trang */
        body, html { 
            height: 100%; 
            font-family: Arial, sans-serif; 
            background-color: #1e1e1e; 
            overflow: hidden; 
            position: fixed;
            width: 100%;
        }
        
        .top-bar {
            background-color: #2d2d2d; color: #ddd; padding: 5px 10px; font-size: 11px;
            text-align: center; border-bottom: 1px solid #444; height: 28px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .top-bar b { color: #fff; }

        /* Khung lưới chiếm trọn phần còn lại của màn hình điện thoại */
        .grid-stack { 
            background: #1e1e1e; 
            height: calc(100vh - 28px); 
        }

        .grid-stack-item-content {
            background-color: #ffffff; border-radius: 4px; display: flex;
            flex-direction: column; overflow: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
        }

        .browser-header {
            color: white; padding: 5px 8px; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: space-between; 
            cursor: move; user-select: none; height: 26px;
        }

        .cococ-header { background-color: #00875a; }
        .firefox-header { background-color: #ff7139; }
        .google-header { background-color: #4285f4; }
        .uc-header { background-color: #ff6600; }

        .browser-content { flex: 1; width: 100%; height: 100%; border: none; background-color: #fff; }
    </style>
</head>
<body>

    <div class="top-bar">
        📱 <b>Chế độ Mobile:</b> 4 màn hình vừa khít thiết bị di động.
    </div>

    <!-- 
      - Màn hình điện thoại chia lưới chuẩn: 
      - Mỗi ô chiếm w: 6, h: 12 (trên tổng số 12 cột) -> Tự động thành 2 cột, 2 hàng lấp đầy khít màn hình.
    -->
    <div class="grid-stack">
        <div class="grid-stack-item" gs-id="browser-1" gs-x="0" gs-y="0" gs-w="6" gs-h="12">
            <div class="grid-stack-item-content">
                <div class="browser-header cococ-header">🟢 Cốc Cốc</div>
                <iframe src="https://coccoc.com/search" class="browser-content"></iframe>
            </div>
        </div>

        <div class="grid-stack-item" gs-id="browser-2" gs-x="6" gs-y="0" gs-w="6" gs-h="12">
            <div class="grid-stack-item-content">
                <div class="browser-header firefox-header">🦊 Firefox</div>
                <iframe src="https://www.mozilla.org/vi/" class="browser-content"></iframe>
            </div>
        </div>

        <div class="grid-stack-item" gs-id="browser-3" gs-x="0" gs-y="12" gs-w="6" gs-h="12">
            <div class="grid-stack-item-content">
                <div class="browser-header google-header">🌐 Google</div>
                <iframe src="https://www.google.com/search?igu=1" class="browser-content"></iframe>
            </div>
        </div>

        <div class="grid-stack-item" gs-id="browser-4" gs-x="6" gs-y="12" gs-w="6" gs-h="12">
            <div class="grid-stack-item-content">
                <div class="browser-header uc-header">🐿️ UC Web</div>
                <iframe src="https://ucweb.com" class="browser-content"></iframe>
            </div>
        </div>
    </div>

    <!-- Thư viện Gridstack JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gridstack.js/10.1.2/gridstack-all.js"></script>
    
    <!-- Thư viện Firebase Realtime Database (Tùy chọn đồng bộ) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Cấu hình Firebase (Điền lại thông tin của bạn nếu muốn đồng bộ online)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Khởi tạo Firebase (Bỏ qua đoạn này hoặc điền đúng config nếu dùng tính năng phòng chung)
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
            var layoutRef = db.ref('shared_room/layout');
        } catch(e) {
            console.log("Firebase chưa được cấu hình, chạy ở chế độ offline cục bộ.");
        }

        let isUpdatingFromRemote = false;

        // Khởi tạo Gridstack tối ưu cho mobile (Khóa chiều cao tự động co giãn theo màn hình)
        const grid = GridStack.init({
            cellHeight: 'auto', // Tự động chia đều chiều cao theo màn hình thiết bị
            float: true,
            disableResize: true, // Khóa tính năng thay đổi kích thước trên di động cho đỡ bị vỡ giao diện
            minRow: 2,
            maxRow: 2
        });

        // Đồng bộ nếu có Firebase
        if (typeof db !== 'undefined') {
            grid.on('change', function(event, items) {
                if (isUpdatingFromRemote) return;
                const serializedData = grid.save(false);
                layoutRef.set(serializedData);
            });

            layoutRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    isUpdatingFromRemote = true;
                    grid.load(data);
                    setTimeout(() => { isUpdatingFromRemote = false; }, 200);
                }
            });
        }
    </script>
</body>
</html>
