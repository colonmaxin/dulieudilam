<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở ứng dụng từ HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Đang chuyển hướng đến ứng dụng...</h2>
    <p>Nếu trang không tự động mở, vui lòng nhấn nút bên dưới:</p>
    
    <!-- Nút thủ công nếu trình duyệt chặn tự động mở -->
    <button onclick="openApp()">Mở ứng dụng</button>

    <script>
        function openApp() {
            // Thay thế 'myapp://' bằng Custom URL Scheme của ứng dụng bạn muốn mở
            // Ví dụ: 
            // - YouTube: youtube://
            // - Shopee: shopee://
            // - Telegram: tg://
            var appScheme = "myapp://path"; 
            
            // Đường dẫn dự phòng (Fallback) nếu chưa cài app (Ví dụ: link tải trên CH Play / App Store)
            var fallbackUrl = "https://play.google.com/store/apps/details?id=ten_package_cua_ban";

            // Thử mở app
            window.location.href = appScheme;

            // Thiết lập thời gian chờ, nếu sau 2 giây mà app không mở thì chuyển hướng đến Fallback URL
            setTimeout(function() {
                var hidden = window.document.hidden || window.document.webkitHidden;
                if (!hidden) {
                    // Người dùng có thể chưa cài app, chuyển đến trang tải
                    window.location.href = fallbackUrl;
                }
            }, 2000);
        }

        // Tự động chạy hàm khi vừa load trang xong
        window.onload = function() {
            openApp();
        };
    </script>

</body>
</html>
