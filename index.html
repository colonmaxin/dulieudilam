<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Thiếp Điện Tử</title>
    <!-- Thư viện FontAwesome để lấy icon mạng xã hội -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Phần nền phía trên của danh thiếp */
        .card-header {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 120px;
            position: relative;
        }

        /* Ảnh đại diện */
        .profile-img-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #fff;
            padding: 5px;
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Nội dung thông tin */
        .card-body {
            padding: 70px 30px 30px 30px;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            color: #0077b5;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Danh sách các nút liên kết */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f8f9fa;
            color: #333;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #e1e4e8;
            transition: all 0.3s ease;
        }

        .btn-link i {
            font-size: 18px;
        }

        /* Hiệu ứng khi rê chuột vào nút */
        .btn-link:hover {
            background: #2a5298;
            color: #fff;
            border-color: #2a5298;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 82, 152, 0.3);
        }

        /* Màu riêng cho một số nút */
        .btn-link.facebook:hover { background: #1877f2; border-color: #1877f2; }
        .btn-link.zalo:hover { background: #0068ff; border-color: #0068ff; }
        .btn-link.phone:hover { background: #28a745; border-color: #28a745; }
        .btn-link.email:hover { background: #ea4335; border-color: #ea4335; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Banner trên -->
        <div class="card-header">
            <div class="profile-img-container">
                <!-- Thay link ảnh của bạn vào thuộc tính src -->
                <img src="https://via.placeholder.com/150" alt="Ảnh đại diện">
            </div>
        </div>

        <!-- Thông tin cá nhân -->
        <div class="card-body">
            <h1 class="name">Nguyễn Văn A</h1>
            <p class="title">Chuyên Viên Phát Triển Phần Mềm</p>
            <p class="bio">Xin chào! Tôi là lập trình viên đam mê tạo ra các giải pháp công nghệ tối ưu và trải nghiệm người dùng tuyệt vời.</p>

            <!-- Các nút liên hệ/mạng xã hội -->
            <div class="links-container">
                <a href="tel:0123456789" class="btn-link phone">
                    <i class="fa-solid fa-phone"></i> Gọi Điện Thoại
                </a>
                <a href="mailto:email@example.com" class="btn-link email">
                    <i class="fa-solid fa-envelope"></i> Gửi Email
                </a>
                <a href="https://zalo.me/0123456789" target="_blank" class="btn-link zalo">
                    <i class="fa-solid fa-comment-dots"></i> Chat Zalo
                </a>
                <a href="https://facebook.com" target="_blank" class="btn-link facebook">
                    <i class="fa-brands fa-facebook"></i> Facebook Cá Nhân
                </a>
                <a href="https://linkedin.com" target="_blank" class="btn-link">
                    <i class="fa-brands fa-linkedin"></i> LinkedIn
                </a>
            </div>
        </div>
    </div>

</body>
</html>
