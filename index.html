<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình duyệt nhúng tích hợp xem số dư</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Thanh hiển thị số dư */
        .balance-bar {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .balance-value {
            font-size: 18px;
            background: #2196F3;
            padding: 5px 12px;
            border-radius: 4px;
        }
        /* Thanh công cụ điều hướng */
        .browser-toolbar {
            background-color: #34495e;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .browser-toolbar button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .browser-toolbar button:hover {
            background-color: #27ae60;
        }
        .browser-toolbar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        /* Khung chứa trang web */
        .browser-content {
            flex: 1;
            background-color: white;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Thanh thông tin số dư -->
    <div class="balance-bar">
        <span>💰 Số dư tài khoản nhận được:</span>
        <span id="externalBalance" class="balance-value">Đang cập nhật...</span>
    </div>

    <!-- Thanh công cụ trình duyệt -->
    <div class="browser-toolbar">
        <button onclick="reloadPage()">🔄</button>
        <input type="text" id="urlInput" placeholder="Nhập URL hoặc dùng trang mẫu...">
        <button onclick="loadWebPage()">Đi</button>
    </div>

    <!-- Khung iframe -->
    <div class="browser-content">
        <iframe id="webFrame"></iframe>
    </div>

    <script>
        const webFrame = document.getElementById('webFrame');
        const urlInput = document.getElementById('urlInput');
        const balanceDisplay = document.getElementById('externalBalance');

        // Mô phỏng trang web có form đăng nhập và sau khi đăng nhập sẽ hiển thị số dư
        const sampleWebPageContent = `
            <!DOCTYPE html>
            <html lang="vi">
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Arial; padding: 20px; background: #f9f9f9; text-align: center; }
                    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; width: 300px; }
                    input { width: 90%; padding: 8px; margin: 5px 0; }
                    button { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
                </style>
            </head>
            <body>
                <div class="card" id="loginBox">
                    <h3>Đăng nhập hệ thống</h3>
                    <input type="text" id="username" placeholder="Tên đăng nhập"><br>
                    <input type="password" id="password" placeholder="Mật khẩu"><br>
                    <button onclick="login()">Đăng nhập</button>
                </div>

                <div class="card" id="dashboardBox" style="display: none;">
                    <h3>Trang Quản Trị</h3>
                    <p>Số dư tài khoản: <strong id="myBalance" style="color: green; font-size: 20px;">2,500,000 VNĐ</strong></p>
                    <button onclick="logout()" style="background: #e74c3c;">Đăng xuất</button>
                </div>

                <script>
                    function sendBalance() {
                        const balanceText = document.getElementById('myBalance').innerText;
                        window.parent.postMessage({ type: 'UPDATE_BALANCE', balance: balanceText }, '*');
                    }

                    function login() {
                        // Giả lập đăng nhập thành công
                        document.getElementById('loginBox').style.display = 'none';
                        document.getElementById('dashboardBox').style.display = 'block';
                        sendBalance(); // Gửi số dư ra ngoài trình duyệt cha sau khi đăng nhập thành công
                    }

                    function logout() {
                        document.getElementById('loginBox').style.display = 'block';
                        document.getElementById('dashboardBox').style.display = 'none';
                        window.parent.postMessage({ type: 'UPDATE_BALANCE', balance: 'Chưa đăng nhập' }, '*');
                    }
                <\/script>
            </body>
            </html>
        `;

        const sampleUrl = 'data:text/html;charset=utf-8,' + encodeURIComponent(sampleWebPageContent);
        
        urlInput.value = "Trang web mẫu nội bộ";
        webFrame.src = sampleUrl;

        function loadWebPage() {
            let url = urlInput.value.trim();
            if (url === "Trang web mẫu nội bộ" || url === "") {
                webFrame.src = sampleUrl;
            } else {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                    urlInput.value = url;
                }
                webFrame.src = url;
            }
        }

        function reloadPage() {
            webFrame.src = webFrame.src;
        }

        // Lắng nghe dữ liệu (số dư) gửi từ iframe ra ngoài
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'UPDATE_BALANCE') {
                balanceDisplay.innerText = event.data.balance;
            }
        });
    </script>

</body>
</html>
